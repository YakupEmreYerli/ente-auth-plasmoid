name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste codes, secrets, export files or your vault. For security problems, use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `ente-codes --json status`
      description: It shows only the state and sync status, no codes.
      render: json
  - type: input
    id: env
    attributes:
      label: Environment
      description: Distribution, Plasma version (`plasmashell --version`), `ente-codes --version`, `ente version`
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options: [Panel widget, Setup, Sync with Ente, Command line, Logos]
