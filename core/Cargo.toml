[package]
name = "ente-codes"
version = "0.1.0"
edition = "2021"
description = "Ente Auth two-factor codes for the KDE Plasma panel, locked in memory"
license = "GPL-2.0-or-later"
repository = "https://github.com/YakupEmreYerli/ente-auth-plasmoid"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
nix = { version = "0.29", features = ["term", "poll", "process", "signal", "fs"] }
regex = "1"
rpassword = "7"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
unicode-normalization = "0.1"
ureq = "2"
url = "2"
zeroize = { version = "1", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
